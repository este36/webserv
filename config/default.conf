server
{
	listen 					1024;
	server_name 			localhost;
	client_max_body_size 	1048576;

	location /
	{
		root 					/var/www/html;
		index 					index.html;
		allow_methods 			GET;
	}

	location /upload 
	{
		root					/var/www/html;
		allow_methods			POST;
		upload_store			/var/www/html;
	}

	location /old
	{
		return 301 /new;
	}
}