server
{
	listen 				4242;
	server_name 			localhost;
	client_max_body_size 		44684864;

	location /
	{
		root 			/var/www/html;
		index 			index.html;
		autoindex		on;
		allow_methods 		GET POST DELETE;
		error_page 		404 /errors/404.html;
		error_page 		500 502 503 /errors/50x.html;
	}

	location /upload 
	{
		root			/var/www/html;
		allow_methods		GET;
		upload_store		/var/www/html;
	}

	location /old
	{
		return 301 /new;
	}
}

server 
{
	listen 			8081;
	server_name 		localhost;

    location / {
        root /data/www;
    }

    location /images/ {
        root /data;
    }
}

server 
{
	listen 			8080;
	server_name 		localhost;

    location /cgi-bin {
        root ./var/www/cgi-bin;
        cgi .py /usr/bin/python3;
        cgi .php /usr/bin/php-cgi;
	}
}