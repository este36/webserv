server
{
	listen 						4242;
	server_name 				local_host;
	client_max_body_size 		44684864;

	location /
	{
		root 					/var/www/html;
		index 					index.html;
		autoindex				on;
		allow_methods 			GET POST DELETE;
	}

	location /upload 
	{
		root					/var/www/html;
		allow_methods			GET;
		upload_store			/var/www/html;
	}

	location /old
	{
		return 305 /new;
	}
}

server {
    location / {
        root /data/www;
    }

    location /images/ {
        root /data;
    }
}